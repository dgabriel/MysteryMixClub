# Flaught adversarial review configuration
# See https://github.com/flaught/core for full documentation
#
# Landed via ADR 0017 (MysteryMixClub-j8ij): artifact-only (no PR comments,
# no pull-requests:write), full LLM pass, non-blocking (continue-on-error)
# in .github/workflows/ci.yml until proven out.
#
# Provider swapped to Ollama Cloud for evaluation — see the bead for
# context; ADR 0017's text still says "via Anthropic" and hasn't been
# updated to match yet.

version: 1

# ── Stack declaration ──────────────────────────────────────
stack:
  languages: [python, typescript]
  frameworks: [fastapi, react]
  runtime: mixed

# ── LLM provider ───────────────────────────────────────────
llm:
  provider: ollama
  model: glm-5.2:cloud       # Ollama Cloud — hosted, no local server needed
  base_url: https://ollama.com
  api_key_env: OLLAMA_API_KEY
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120

# ── Deterministic tools ────────────────────────────────────
# tools:
#   semgrep:
#     enabled: true
#     # config: path/to/semgrep-rules.yml
#   linter:
#     enabled: true
#     # command: eslint  # override auto-detected linter
#   vuln_scanner:
#     enabled: true
#     # command: npm audit  # override auto-detected scanner

# ── Test inversion ──────────────────────────────────────────
# test_inversion:
#   enabled: true
#   # command: pytest  # override auto-detected test command

# ── Scope-creep detection ─────────────────────────────────
# scope_creep:
#   enabled: true
#   intent_source: pr_description  # pr_description | linked_issue | both

# ── Lighthouse (optional, degrades cleanly) ─────────────────
# lighthouse:
#   enabled: false
#   # preview_url: https://deploy-preview-42.example.com

# ── Noise budget ───────────────────────────────────────────
# noise_budget:
#   critical: 5
#   high: 10
#   medium: 15
#   low: 20
#   info: 25

# ── Severity gate ──────────────────────────────────────────
# severity_gate:
#   fail_on: high  # none | critical | high | medium

# ── Dismissals ───────────────────────────────────────────────
# Findings matching an entry in the dismissal store (see `flaught dismiss`)
# are auto-marked dismissed on every subsequent run and excluded from the
# severity gate.
# dismissals:
#   enabled: true
#   path: .flaught-dismissals.json

# ── Exclusions ─────────────────────────────────────────────
exclude:
  paths:
    - "node_modules/**"
    - "backend/.venv/**"
    - "frontend/dist/**"
    - "**/*.min.js"
