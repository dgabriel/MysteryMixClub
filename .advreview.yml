# Flaught adversarial review configuration
# See https://github.com/flaught/core for full documentation

version: 1

# ── Stack declaration ──────────────────────────────────────
# Omit to auto-detect from repo contents (package.json, requirements.txt, etc.)
# stack:
#   languages: [python, typescript]
#   frameworks: [fastapi, react]
#   runtime: node  # node | python | mixed | auto

# ── LLM provider ───────────────────────────────────────────
llm:
  provider: groq            # openai | groq | gemini | anthropic | ollama
  model: groq/compound-mini # e.g. gpt-4o for openai, claude-sonnet-5 for anthropic
  api_key_env: GROQ_API_KEY # e.g. OPENAI_API_KEY for openai, ANTHROPIC_API_KEY for anthropic
  # base_url: null          # override for OpenAI-compatible endpoints, or an
                             # Anthropic Messages-API-compatible proxy/gateway
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120     # timeout for LLM API calls

# ── Deterministic tools ────────────────────────────────────
# Explicit, not left to schema default (ADR 0023, same lesson as ADR 0022's
# dismissals: block) -- 0.10.0 added test_weakening and dependency_sanity,
# ON by default, so a commented-out block here would silently accept
# whatever Flaught ships as default next time too. Reviewed and kept on:
# test_weakening fits this repo's existing test-rigor conventions (targeted
# + full-suite pre-push discipline, ADR 0005 test isolation); dependency_sanity
# defends against a real supply-chain risk class (typosquatting) worth the
# npm-registry calls it makes during CI.
tools:
  semgrep:
    enabled: true
    # config: path/to/semgrep-rules.yml
  linter:
    enabled: true
    # command: eslint  # override auto-detected linter -- see MysteryMixClub-ta06
  vuln_scanner:
    enabled: true
    # command: npm audit  # override auto-detected scanner
  test_weakening:
    enabled: true
  dependency_sanity:
    enabled: true

# ── Test inversion ──────────────────────────────────────────
# Explicit (ADR 0023) -- was already running under the implicit default
# (confirmed: local runs print "Running test inversion..." unprompted),
# same implicit-default pattern as everything else fixed today.
test_inversion:
  enabled: true
  # command: pytest  # override auto-detected test command
  scope_to_blast_radius: true  # only flag tests in the diff's changed/blast-radius files
  skip_docs_only_diffs: true   # skip entirely when every changed file is documentation

# ── Scope-creep detection ─────────────────────────────────
# Explicit (ADR 0023) -- also already running under the implicit default.
# exclude_paths now actually uses the docs/adr/** exclusion the commented
# template always suggested but never enabled: PR #285's own LLM pass
# flagged its own accompanying ADR file as scope creep (F-0007), exactly
# the case this exclusion exists for.
scope_creep:
  enabled: true
  intent_source: pr_description  # pr_description | linked_issue | both
  exclude_paths:
    - "docs/adr/**"

# ── Lighthouse (optional, degrades cleanly) ─────────────────
# lighthouse:
#   enabled: false
#   # preview_url: https://deploy-preview-42.example.com

# ── Noise budget ───────────────────────────────────────────
# Explicit (ADR 0023), values unchanged from schema default -- just no
# longer invisible now that undismissed findings over these thresholds
# block merge (ADR 0022).
noise_budget:
  critical: 5
  high: 10
  medium: 15
  low: 20
  info: 25

# ── Severity gate ──────────────────────────────────────────
# Explicit (ADR 0023), value unchanged from schema default.
severity_gate:
  fail_on: high  # none | critical | high | medium

# ── Dismissals ───────────────────────────────────────────────
# Findings matching an entry in the dismissal store (see `flaught dismiss`)
# are auto-marked dismissed on every subsequent run and excluded from the
# severity gate.
# Explicit, not left to schema default (ADR 0022) -- this repo already got
# burned once by a commented-out block masking whether a tool/feature was
# actually on (ADR 0018: the `tools:` block being commented out gave the
# impression semgrep was disabled when it was on by default). Now that the
# gate blocks merge, whether dismissals persist is not something to leave
# implicit.
dismissals:
  enabled: true
  path: .flaught-dismissals.json

# ── Prompt templates ────────────────────────────────────────
# Override or extend the LLM prompts by dropping files into .flaught-prompt/
# See https://github.com/flaught/core for the full list of template files.
# prompt:
#   enabled: true
#   path: .flaught-prompt

# ── Exclusions ─────────────────────────────────────────────
# exclude:
#   paths:
#     - "node_modules/**"
#     - "vendor/**"
#     - "**/*.min.js"
#     - "**/*.min.css"
#     - "**/*.generated.*"
#   patterns: []
