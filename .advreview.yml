# Flaught adversarial review configuration
# See https://github.com/flaught/core for full documentation
#
# Landed via ADR 0017 (MysteryMixClub-j8ij) as artifact-only, full LLM pass,
# non-blocking. ADR 0018 (MysteryMixClub-tq2a) moved it to blocking with
# findings posted as a PR comment, once artifact-only had proven the tool
# out — see .github/workflows/ci.yml's `flaught` job. LLM provider is under
# active evaluation — see llm: below for the current choice.

version: 1

# ── Stack declaration ──────────────────────────────────────
stack:
  languages: [python, typescript]
  frameworks: [fastapi, react]
  runtime: mixed

# ── LLM provider ───────────────────────────────────────────
# Groq — a first-class provider in Flaught's own createProvider() (unlike the
# earlier Ollama Cloud setup, which had to route through the openai-compatible
# adapter to work around a bug in Flaught's native ollama adapter). base_url
# is left unset so it falls through to Flaught's own Groq default
# (https://api.groq.com/openai/v1). Model is openai/gpt-oss-120b — one of the
# two models Flaught's own error-hint text names as known-good on Groq.
llm:
  provider: groq
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120

# ── Deterministic tools ────────────────────────────────────
# tools:
#   semgrep:
#     enabled: true
#     # config: path/to/semgrep-rules.yml
#   linter:
#     enabled: true
#     # command: eslint  # override auto-detected linter
#   vuln_scanner:
#     enabled: true
#     # command: npm audit  # override auto-detected scanner

# ── Test inversion ──────────────────────────────────────────
# test_inversion:
#   enabled: true
#   # command: pytest  # override auto-detected test command

# ── Scope-creep detection ─────────────────────────────────
# scope_creep:
#   enabled: true
#   intent_source: pr_description  # pr_description | linked_issue | both

# ── Lighthouse (optional, degrades cleanly) ─────────────────
# lighthouse:
#   enabled: false
#   # preview_url: https://deploy-preview-42.example.com

# ── Noise budget ───────────────────────────────────────────
# noise_budget:
#   critical: 5
#   high: 10
#   medium: 15
#   low: 20
#   info: 25

# ── Severity gate ──────────────────────────────────────────
# severity_gate:
#   fail_on: high  # none | critical | high | medium

# ── Dismissals ───────────────────────────────────────────────
# Findings matching an entry in the dismissal store (see `flaught dismiss`)
# are auto-marked dismissed on every subsequent run and excluded from the
# severity gate.
# dismissals:
#   enabled: true
#   path: .flaught-dismissals.json

# ── Exclusions ─────────────────────────────────────────────
exclude:
  paths:
    - "node_modules/**"
    - "backend/.venv/**"
    - "frontend/dist/**"
    - "**/*.min.js"
