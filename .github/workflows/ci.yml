name: CI

on:
  pull_request:
    branches:
      - main
      - develop

# Least-privilege GITHUB_TOKEN (code scanning #1/#3): every step here only
# checks out code, runs lint/test, and uploads a coverage artifact -- none of
# it needs anything beyond reading the repo. The one exception is the
# `flaught` job, which grants itself `pull-requests: write` at the job level
# (ADR 0018) to post its findings as a PR comment -- every other job stays on
# this workflow-level `contents: read` grant.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Non-blocking (MYS-47): surface prod-dependency advisories on every PR so a
      # vulnerable runtime dep can't regress silently. Dev-only tooling advisories
      # are excluded to keep the signal actionable; a red step never blocks merge.
      - name: Dependency audit (prod deps)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # app.db.session builds the engine at import from DATABASE_URL, and the test
    # suite (tests/conftest.py) runs against a real Postgres at this URL. SECRET_KEY
    # is needed so JWT signing/verification works in the auth tests. These are
    # throwaway CI values — not real secrets.
    env:
      DATABASE_URL: postgresql+asyncpg://mmc:mmc@localhost:5432/mysterymixclub_test
      SECRET_KEY: ci-test-secret-not-for-production
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mmc
          POSTGRES_PASSWORD: mmc
          POSTGRES_DB: mysterymixclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmc -d mysterymixclub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # ADR 0005: same fsync/synchronous_commit relaxation as docker-compose's
      # mmc-postgres, applied here via ALTER SYSTEM + reload since the GH
      # Actions `services:` block has no equivalent of docker-compose's
      # `command:` (its `options:` are docker-create flags, not postgres args).
      # Both settings are reload-context in Postgres (no restart needed). This
      # container only ever backs this CI job's test database — never
      # staging/prod.
      - name: Relax test Postgres durability (ADR 0005 — test/CI-only)
        run: |
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test -c "ALTER SYSTEM SET fsync = off;"
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test -c "ALTER SYSTEM SET synchronous_commit = off;"
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test -c "SELECT pg_reload_conf();"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy app

      # Guards against "model added but migration missing": prove the migrations
      # apply cleanly (and reverse) against a fresh DB on every PR. Uses a separate
      # throwaway database so it never collides with the schema pytest's conftest
      # builds via create_all on mysterymixclub_test.
      - name: Alembic migrations apply
        run: |
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test \
            -c "CREATE DATABASE mmc_migrate_check;"
          export DATABASE_URL=postgresql+asyncpg://mmc:mmc@localhost:5432/mmc_migrate_check
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Pytest (with coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      # Non-blocking (MYS-47): pip-audit against the resolved env on every PR.
      # --skip-editable skips the local editable package (not on PyPI); a red step
      # never blocks merge but surfaces a newly-vulnerable dependency.
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable
        continue-on-error: true

  flaught:
    name: Flaught (adversarial review)
    runs-on: ubuntu-latest
    # ADR 0018 (supersedes the corresponding scoping calls in ADR 0017),
    # partially superseded by ADR 0019: blocking now that the tool has
    # proven out artifact-only — exit code 1 (findings at/above
    # severity_gate.fail_on, default "high") fails this job and the PR's
    # merge check along with it. Exit code 2 (config/LLM error, e.g. a Groq
    # outage or a missing secret) only warns — a tool/infra fault isn't
    # evidence of a real code problem (ADR 0019, Flaught findings F-002/F-003).
    # Findings also get posted to the PR itself as a comment, which is the
    # one job in this workflow that needs `pull-requests: write` (see the
    # note on the workflow-level `permissions:` block above).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `origin/<base_ref>` resolves for the diff below —
          # a shallow clone only has the PR's own commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Flaught
        # Pinned (Flaught finding F-001): an unpinned global install lets a
        # newly published version run in CI with zero review. Bump
        # deliberately.
        run: npm install -g @flaught/core@0.7.1

      - name: Adversarial review
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Flaught finding (semgrep yaml.github-actions.security.run-shell-injection,
          # CRITICAL): the PR title is attacker-controllable text (anyone who can
          # open a PR sets it) and was previously interpolated straight into the
          # `run:` shell string below. Routing it through an env var instead means
          # the shell only ever substitutes $PR_TITLE as a single argument, never
          # re-parses its contents as shell syntax — the standard GitHub Actions
          # hardening pattern for any expression that isn't a trusted, closed-form
          # value like `github.base_ref` already is.
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Redirect (not pipe) stdout to a file: this keeps flaught's own exit
        # code as the step's exit code, with no dependency on `pipefail`
        # being set. `--quiet` still emits the final markdown report on
        # stdout (just not the progress lines) — that's what becomes the PR
        # comment body below, so the comment matches what a local run prints.
        #
        # ADR 0019: `set +e` + capture the exit code into $GITHUB_OUTPUT
        # instead of letting the step fail directly — exit code 1 (real
        # findings) and exit code 2 (tool/LLM/infra error) need different
        # handling, decided in the two steps below, not by this step's own
        # pass/fail.
        run: |
          set +e
          flaught review \
            --base "origin/${{ github.base_ref }}" \
            --pr-description "$PR_TITLE" \
            --output flaught-findings.json \
            --quiet > flaught-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaught-findings
          path: flaught-findings.json
          if-no-files-found: ignore

      - name: Post findings to PR
        # Best-effort: a real finding failing the step above is the actual
        # gate. Failing to leave a comment (e.g. a fork PR, where GITHUB_TOKEN
        # is forced read-only regardless of this job's `permissions:` block)
        # shouldn't itself add a second, more confusing red X.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s flaught-report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file flaught-report.md \
              --edit-last --create-if-none
          fi

      - name: Check severity gate
        # ADR 0019: exit code 1 means real findings at/above
        # severity_gate.fail_on — this is the actual merge gate.
        if: steps.review.outputs.exit_code == '1'
        run: |
          echo "::error::Flaught found findings that exceed the severity gate threshold"
          exit 1

      - name: Check for errors
        # ADR 0019 (Flaught findings F-002/F-003): exit code 2 is a
        # config/API/LLM error, e.g. a Groq outage — not evidence of a real
        # code problem, so it warns instead of blocking merge.
        if: steps.review.outputs.exit_code == '2'
        run: |
          echo "::warning::Flaught encountered an error (config, API, or runtime) and could not complete the review. This does NOT block merge — an LLM/infra outage is not evidence of a real code problem. Check the workflow logs and consider re-running."
