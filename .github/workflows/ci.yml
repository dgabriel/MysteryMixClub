name: CI

on:
  pull_request:
    branches:
      - main
      - develop

# Least-privilege GITHUB_TOKEN (code scanning #1/#3): every step here only
# checks out code, runs lint/test, and uploads a coverage artifact -- none of
# it needs anything beyond reading the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Non-blocking (MYS-47): surface prod-dependency advisories on every PR so a
      # vulnerable runtime dep can't regress silently. Dev-only tooling advisories
      # are excluded to keep the signal actionable; a red step never blocks merge.
      - name: Dependency audit (prod deps)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # app.db.session builds the engine at import from DATABASE_URL, and the test
    # suite (tests/conftest.py) runs against a real Postgres at this URL. SECRET_KEY
    # is needed so JWT signing/verification works in the auth tests. These are
    # throwaway CI values — not real secrets.
    env:
      DATABASE_URL: postgresql+asyncpg://mmc:mmc@localhost:5432/mysterymixclub_test
      SECRET_KEY: ci-test-secret-not-for-production
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mmc
          POSTGRES_PASSWORD: mmc
          POSTGRES_DB: mysterymixclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmc -d mysterymixclub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR 0005: same fsync/synchronous_commit relaxation as docker-compose's
      # mmc-postgres, applied here via ALTER SYSTEM + reload since the GH
      # Actions `services:` block has no equivalent of docker-compose's
      # `command:` (its `options:` are docker-create flags, not postgres args).
      # Both settings are reload-context in Postgres (no restart needed). This
      # container only ever backs this CI job's test database — never
      # staging/prod.
      - name: Relax test Postgres durability (ADR 0005 — test/CI-only)
        run: |
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test -c "ALTER SYSTEM SET fsync = off;"
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test -c "ALTER SYSTEM SET synchronous_commit = off;"
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test -c "SELECT pg_reload_conf();"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy app

      # Guards against "model added but migration missing": prove the migrations
      # apply cleanly (and reverse) against a fresh DB on every PR. Uses a separate
      # throwaway database so it never collides with the schema pytest's conftest
      # builds via create_all on mysterymixclub_test.
      - name: Alembic migrations apply
        run: |
          PGPASSWORD=mmc psql -h localhost -U mmc -d mysterymixclub_test \
            -c "CREATE DATABASE mmc_migrate_check;"
          export DATABASE_URL=postgresql+asyncpg://mmc:mmc@localhost:5432/mmc_migrate_check
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Pytest (with coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      # Non-blocking (MYS-47): pip-audit against the resolved env on every PR.
      # --skip-editable skips the local editable package (not on PyPI); a red step
      # never blocks merge but surfaces a newly-vulnerable dependency.
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable
        continue-on-error: true

  flaught:
    name: Adversarial review (Flaught)
    runs-on: ubuntu-latest
    # Scoped to just this job (ADR 0020) -- the workflow-level permissions
    # block above stays contents: read for frontend/backend. Only this job's
    # PR-comment step needs write access.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Pinned to an exact version (ADR 0017) so a newly published version
      # can't start running in CI unreviewed. 0.10.0 -> 0.12.0, ADR 0026.
      - name: Install Flaught
        run: npm install -g @flaught/core@0.12.0

      - name: Install Semgrep
        run: pip install semgrep

      # Flaught's linter/vuln-scanner auto-detection looks for eslint/npm
      # audit and ruff/pip-audit from wherever it's invoked (repo root here).
      # This repo's root package.json has no test/lint scripts -- the real
      # toolchains live in frontend/ and backend/ -- so without these two
      # installs, both tools would silently find nothing and skip (ADR 0020).
      - name: Install frontend dependencies (for eslint / npm audit)
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies (for ruff / pip-audit)
        working-directory: backend
        run: pip install -e ".[dev]"

      # Blocking as of ADR 0022 -- undismissed findings at or above the
      # severity gate now fail the merge check. Exit codes distinguish a real
      # gate trip from a tool/config fault (ADR 0017): 1 means undismissed
      # findings over budget, and DOES block; 2 means flaught itself couldn't
      # run cleanly (e.g. no GROQ_API_KEY reachable, such as a fork PR) and
      # does NOT block, since that's an infra gap, not a review outcome. Fix
      # a real finding or dismiss it (`flaught dismiss <id> --reason ...`,
      # persisted to the git-tracked .flaught-dismissals.json) to unblock.
      # --config-from-base (0.11.0, ADR 0026): loads .advreview.yml from the
      # base ref via `git show` instead of the working tree, so a PR can't
      # edit its own config (e.g. linter.command, a real shell string --
      # ADR 0025) to inject commands into a job that holds CI secrets.
      # Consequence: a PR that itself edits .advreview.yml is reviewed under
      # the OLD (pre-PR) config until merged -- accepted tradeoff, security
      # over self-referential convenience.
      - name: Run adversarial review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          flaught review \
            --base "origin/${PR_BASE_REF}" \
            --head HEAD \
            --output findings.json \
            --pr-description "${PR_TITLE}" \
            --config-from-base \
            --quiet
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Flaught found undismissed findings at or above the severity gate. See the PR comment, then fix or 'flaught dismiss <id> --reason ...' and push again."
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::warning::Flaught exited $code (tool/config fault, not a findings gate trip) -- not blocking, but investigate."
          fi

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaught-findings
          path: findings.json
          if-no-files-found: ignore

      # `flaught report --from` (0.12.0, ADR 0026, closes upstream
      # flaught/core#75) renders the comment from the already-computed
      # findings.json -- no second review run, no LLM call, and critically
      # no longer drops LLM findings from the comment. Replaces the old
      # `flaught review --no-llm` re-run, which silently produced a comment
      # containing only deterministic/test-inversion/scope-creep findings.
      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f findings.json ]; then
            flaught report --from findings.json | gh pr comment "${PR_NUMBER}" --body-file -
          fi
