
# Agent-workflow observability stack (Prometheus + Grafana), local-only.
#
# This is NOT MysteryMixClub's application observability (see MysteryMixClub-p0qzz0
# for that, tracked separately). This stack measures the token/cost footprint of the
# repo's own Claude Code multi-agent workflow (developer/tester/reviewer/ui-agent/
# product-manager subagents). Deliberately kept out of backend/ and out of the app's
# own docker-compose.yml so the two concerns never get tangled.
#
# Usage: docker-compose up -d   (from this directory)
# See ./README.md for the full runbook, including the one env-var step this stack
# depends on but does NOT set for you.

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: mmc-agent-obs-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1y"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Lets the container reach Claude Code's OTel Prometheus exporter running on
      # the host at localhost:9464. Works out of the box on Docker Desktop
      # (macOS/Windows); the extra_hosts entry makes it work on Linux too.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mmc-agent-obs-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  prometheus-data:
  grafana-data:
